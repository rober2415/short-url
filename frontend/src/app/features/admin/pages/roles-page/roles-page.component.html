<app-roles-table 
    [roles]="(roles$ | async) ?? []"
    (createdRole)="roleSelected = null"
    (updatedRole)="roleSelected = $event"
    (deletedRole)="onDelete($event)">
</app-roles-table>
<app-roles-form
    [role]="roleSelected"
    [permissions]="(permissions$ | async)  ?? []"
    (createdRole)="onCreate($event)"
    (updatedRole)="onUpdate($event)">
</app-roles-form>
