<app-users-table 
    [users]="(users$ | async) ?? []"
    (createdUser)="userSelected = null" 
    (updatedUser)="userSelected = $event"
    (deletedUser)="onDelete($event)">
</app-users-table>
<app-users-form 
    [user]="userSelected" 
    [roles]="(roles$ | async) ?? []" 
    (createdUser)="onCreate($event)"
    (updatedUser)="onUpdate($event)">
</app-users-form>
