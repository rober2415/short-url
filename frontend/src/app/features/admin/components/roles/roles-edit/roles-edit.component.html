<app-modal modalId="editRoleModal" title="Edit role">
    <form modal-body class="d-flex flex-column gap-2" *ngIf="role" id="editRoleForm" (ngSubmit)="onSubmit()">
        <label for="edit-name">Name</label>
        <input type="text" name="name" id="edit-name" class="form-control input-group" [(ngModel)]="role.name" required>
    </form>
    <ng-container modal-footer>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-success" form="editRoleForm" data-bs-dismiss="modal">
            Save changes
        </button>
    </ng-container>
</app-modal>
