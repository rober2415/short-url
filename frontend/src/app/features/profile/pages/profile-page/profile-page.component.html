<h1>My Profile</h1>
<p>Manage your account information</p>

<app-profile-detail 
    [profile]="profile$ | async"
    [isLoading]="(isLoading$ | async) ?? false">
</app-profile-detail>
<app-profile-edit
    [profile]="profile$ | async"
    (updatedProfile)="onUpdateProfile($event)"
    (updatedPassword)="onUpdatePassword($event)">
</app-profile-edit>
<app-profile-delete
    (deletedProfile)="onDeleteProfile()">
</app-profile-delete>
