<div class="card shadow-sm border p-3 p-md-4 mb-4 rounded-3 overflow-hidden">
    <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <ng-container *ngIf="!isLoading && profile">
        <div class="d-flex justify-content-between align-items-start mb-3">

            <div class="d-flex flex-column gap-2">
                <div>
                    <h5 class="mb-0">Name</h5>
                    <span>{{ profile.name }}</span>
                </div>
                <div>
                    <h5 class="mb-0">Email</h5>
                    <span>{{ profile.email }}</span>
                </div>
                <div>
                    <h5 class="mb-0">Register on</h5>
                    <span>{{ profile.created_at | date }}</span>
                </div>
            </div>

            <div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal"
                    [disabled]="!profile">
                    Edit profile
                </button>
            </div>

        </div>

        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <h5 class="mb-0">Password</h5>
                <span>************</span>
            </div>
            <div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editPasswordModal"
                    [disabled]="!profile">
                    Edit password
                </button>
            </div>
        </div>
    </ng-container>
</div>
