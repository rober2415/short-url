<div class="card shadow-sm border p-3 p-md-4 mb-4 rounded-3 overflow-hidden">
    <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <ng-container *ngIf="!isLoading && profile">
        <div class="d-flex justify-content-between align-items-start mb-3">

            <div class="d-flex flex-column gap-2">
                <h5 class="fw-bold mb-0">Data</h5>
                <div>
                    <small class="text-uppercase d-block">Name</small>
                    <span class="text-muted">{{ profile.name }}</span>
                </div>

                <h5 class="fw-bold mb-0">Account</h5>
                <div>
                    <small class="text-uppercase d-block">Email</small>
                    <span class="text-muted">{{ profile.email }}</span>
                </div>

                <div>
                    <small class="text-uppercase d-block">Register on</small>
                    <span class="text-muted">{{ profile.created_at | date }}</span>
                </div>
            </div>

            <div>
                <button type="button" class="btn btn-primary btn-sm w-100" data-bs-toggle="modal" data-bs-target="#editProfileModal"
                    [disabled]="!profile">
                    Edit profile
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <small class="text-uppercase d-block">Password</small>
                <span class="text-muted">************</span>
            </div>
            <div>
                <button type="button" class="btn btn-primary btn-sm w-100" data-bs-toggle="modal" data-bs-target="#editPasswordModal"
                    [disabled]="!profile">
                    Edit password
                </button>
            </div>
        </div>
    </ng-container>
</div>
