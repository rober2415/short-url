<div class="card shadow-sm border p-3 p-md-4 mb-4">
    <form (ngSubmit)="onSubmit()">
        <label for="url" class="form-label fw-semibold mb-2">
            Paste the URL to be shortened
        </label>
        <div class="input-group input-group-lg border rounded-3 p-0 overflow-hidden">
            
            <span class="input-group-text bg-transparent border-0 pe-2">
                <i class="text-primary bi bi-link-45deg fs-4"></i>
            </span>
            
            <input type="url" class="form-control border-0 bg-transparent fs-6 shadow-none" id="url" name="urlInput" [(ngModel)]="inputUrl"
                placeholder="https://example.com/long-url" required />
            
            <button class="btn btn-primary px-4 fw-medium d-flex align-items-center gap-2 rounded-2" type="submit"
                [disabled]="!inputUrl?.trim()">
                <span class="d-none d-sm-inline">Get URL</span>
                <i class="bi bi-arrow-right-short fs-4"></i>
            </button>
            
        </div>
    </form>
</div>
