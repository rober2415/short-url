<div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-lg-2">
        <div class="card shadow-sm border-0 p-3 h-100">
            <div class="d-flex align-items-center gap-3">
                <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-3">
                    <i class="bi bi-cursor-fill fs-4"></i>
                </div>
                <div>
                    <span class="text-muted small fw-semibold">Total Clics</span>
                    <h4 class="fw-bold mb-0">{{ summary.totalClicks }}</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-2">
        <div class="card shadow-sm border-0 p-3 h-100">
            <div class="d-flex align-items-center gap-3">
                <div class="p-3 bg-success bg-opacity-10 text-success rounded-3">
                    <i class="bi bi-globe-americas fs-4"></i>
                </div>
                <div>
                    <span class="text-muted small fw-semibold">Countries</span>
                    <h4 class="fw-bold mb-0">{{ summary.countriesCount }}</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm border-0 p-3 h-100">
            <div class="d-flex align-items-center gap-3">
                <div class="p-3 bg-warning bg-opacity-10 text-warning rounded-3">
                    <i class="bi bi-phone-fill fs-4"></i>
                </div>
                <div>
                    <span class="text-muted small fw-semibold">Top Device</span>
                    <h4 class="fw-bold mb-0">{{ summary.topDevice }}</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-5">
        <div class="card shadow-sm border-0 p-3 h-100">
            <div class="d-flex align-items-center gap-3">
                <div class="p-3 bg-info bg-opacity-10 text-info rounded-3">
                    <i class="bi bi-link-45deg fs-3"></i>
                </div>
                <div>
                    <span class="text-muted small fw-semibold">Principal Source</span>
                    <h4 class="fw-bold mb-0">{{ summary.topSource | cleanUrl }}</h4>
                </div>
            </div>
        </div>
    </div>
</div>
