<div class="row justify-content-center">

    <div class="card shadow-sm border-0 p-3 p-md-4">
        <div class="card-body">

            <div class="text-center mb-4">
                <div class="mb-2">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                </div>
                <h3 class="fw-bold mb-1">Sign in</h3>
                <p class="text-muted small">Enter your login details to manage your links</p>
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 fs-7"
                role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <form (ngSubmit)="onSubmit()">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold mb-1">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email"
                            [(ngModel)]="loginData.email" placeholder="example@email.com" [disabled]="isLoading"
                            required />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold mb-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input [type]="showPassword ? 'text' : 'password'"
                            class="form-control border-start-0 border-end-0 ps-0" id="password" name="password"
                            [(ngModel)]="loginData.password" placeholder="••••••••" [disabled]="isLoading" required />
                        <button type="button" class="input-group-text border-start-0 bg-transparent text-muted"
                            (click)="toggleShowPassword()">
                            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-medium d-flex align-items-center justify-content-center gap-2"
                    [disabled]="!loginData.email || !loginData.password || isLoading">

                    <ng-container *ngIf="!isLoading">
                        <span>Sign in</span>
                        <i class="bi bi-arrow-right-short fs-4"></i>
                    </ng-container>

                    <ng-container *ngIf="isLoading">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        <span>Logging in...</span>
                    </ng-container>
                </button>

            </form>

        </div>

        <div class="card-footer bg-transparent border-0 text-center pt-3">
            <p class="mb-0 text-muted small">
                Don't have an account?
                <a routerLink="/register" class="fw-bold text-primary text-decoration-none">Sign up</a>
            </p>
        </div>
    </div>
</div>
